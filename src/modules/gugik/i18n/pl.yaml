# Texts of the gugik module in Polish, added to the app's own (i18n/pl.yaml) when app.yaml enables
# the module. A deployment changes them in i18n/pl.yaml of its configuration directory, as any other.

search:
  parcel: 'Działka: znajdź po numerze i obrębie'
  parcelShort: Działka
  parcelHit: Działka {number}
  gugik:
    placeholder: Adres, miejscowość, działka…
    label: Szukaj adresu, miejscowości lub działki
    # Services that did not answer in time, named under the results.
    unavailable:
      parcels: wyszukiwarka działek (ULDK)
      addresses: wyszukiwarka adresów (UUG)
      names: wyszukiwarka nazw miejscowości i obiektów (PRNG)
      units: wyszukiwarka jednostek administracyjnych (PRG)

