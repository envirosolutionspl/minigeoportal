# A deployment changes single texts in i18n/pl.yaml of its configuration directory.
# Texts of a module are in src/modules/<module>/i18n/pl.yaml, added when app.yaml enables it.
# {name} is filled in by the app; texts per number use the forms one, few, many, other.

