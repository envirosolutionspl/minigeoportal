# Layers drawn over the base map: topics of the layer list, the layers, their drawing order.
# A layer's sublayers are listed in the order the layer list shows them; `default: true` ones are
# switched on with the layer. `catalogId` names the same layer in the geoportal.gov.pl catalog.
# Time-capable layers get a `time` block (see docs): a TIME dimension or a series of editions.

topics:
  - id: dzialki
    title: Działki i budynki
  - id: planowanie
    title: Planowanie
  - id: ceny
    title: Ceny
  - id: uzbrojenie
    title: Uzbrojenie i drogi
  - id: granice
    title: Granice i adresy
  - id: teren
    title: Teren i zdjęcia
  - id: srodowisko
    title: Środowisko
  - id: zagrozenia
    title: Zagrożenia
  - id: zabytki
    title: Zabytki i turystyka
  - id: archiwalne
    title: Archiwalne
  - id: pobieranie
    title: Dane do pobrania
  - id: geodezja
    title: Geodezja
  - id: inne
    title: Inne
# Drawing order, lowest first: plans at the bottom, networks over them, parcels over both.
drawOrder:
  - suikzp
  - kimpzp
  - pog
  - kibdot
  - kiut
  - kieg
  - rcn
  - kina
  - prg
overlays:
  - id: kieg
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow
    title: Ewidencja gruntów i budynków
    description: Działki, numery działek, budynki, obręby, użytki.
    topic: dzialki
    starter: true
    catalogId: msKIEG
    keywords:
      - działki
      - ewidencja
      - egib
      - granice
      - numery
      - budynki
      - obręby
      - użytki
      - kontury
      - klasy
    sublayers:
      - name: uzytki
        title: Użytki gruntowe
      - name: kontury
        title: Kontury klasyfikacyjne
      - name: obreby
        title: Granice obrębów
        default: true
      - name: dzialki
        title: Działki
        default: true
      - name: geoportal
        title: Działki uzupełnione z LPIS
      - name: budynki
        title: Budynki
        default: true
      - name: numery_dzialek
        title: Numery działek
        default: true
  - id: kimpzp
    kind: wms
    # `granice` and `plany` are left out: they redirect to municipal servers that reject browser requests.
    url: https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaMiejscowychPlanowZagospodarowaniaPrzestrzennego
    title: Plany miejscowe (MPZP)
    description: Miejscowe plany zagospodarowania przestrzennego.
    topic: planowanie
    starter: true
    catalogId: msMPZP
    opacity: 0.8
    keywords:
      - mpzp
      - plan
      - zagospodarowanie
      - przeznaczenie
      - budowa
      - zabudowa
    sublayers:
      - name: raster
        title: Plany rastrowe (skany rysunków)
        default: true
      - name: wektor-str
        title: Strefy przeznaczenia
        default: true
      - name: wektor-pow
        title: Obiekty powierzchniowe
        default: true
      - name: wektor-lin
        title: Obiekty liniowe
        default: true
      - name: wektor-lzb
        title: Linie zabudowy
        default: true
      - name: wektor-pkt
        title: Obiekty punktowe
        default: true
  - id: pog
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/ext/PlanyOgolneGmin
    title: Plany ogólne gmin (POG)
    description: Strefy planistyczne z uchwalonych planów ogólnych.
    topic: planowanie
    starter: true
    catalogId: msPlanyOgolneGmin
    opacity: 0.8
    keywords:
      - pog
      - plan ogólny
      - strefy
      - planistyczne
    sublayers:
      - name: aktPlanowaniaprzestrzennego
        title: Zasięg planu ogólnego
        default: true
      - name: strefaPlanistyczna
        title: Strefy planistyczne
        default: true
      - name: obszarUzupelnieniaZabudowy
        title: Obszary uzupełnienia zabudowy
        default: true
      - name: obszarZabSrodmiejskiej
        title: Obszary zabudowy śródmiejskiej
        default: true
  - id: rcn
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/service/rcn
    title: Ceny transakcyjne (RCN)
    description: Rejestr cen nieruchomości, tylko powiaty publikujące dane.
    topic: ceny
    starter: true
    catalogId: msRejestrCenNieruchomosci
    keywords:
      - ceny
      - rcn
      - transakcje
      - wartość
      - sprzedaż
      - mieszkania
      - lokale
    sublayers:
      - name: powiaty
        title: Powiaty z danymi
        default: true
      - name: dzialki
        title: 'Transakcje: działki'
        default: true
      - name: budynki
        title: 'Transakcje: budynki'
        default: true
      - name: lokale
        title: 'Transakcje: lokale'
        default: true
  - id: kiut
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaUzbrojeniaTerenu
    title: Uzbrojenie terenu
    description: 'Sieci: woda, kanalizacja, gaz, prąd, telekomunikacja, ciepło.'
    topic: uzbrojenie
    starter: true
    catalogId: msKIUT
    keywords:
