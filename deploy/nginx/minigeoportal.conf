# nginx in front of MiniGeoportal running with compose.proxy.yaml (two replicas of the app on
# 127.0.0.1:8787 and 127.0.0.1:8788). Copy to /etc/nginx/sites-available/, replace example.org with
# your domain, link it into sites-enabled, then `nginx -t && systemctl reload nginx` and get a
# certificate:
#   certbot --nginx -d example.org -d www.example.org --redirect
#
# In /etc/nginx/nginx.conf raise the limits of the workers, which default to 1024 open files and
# 768 connections each (a proxied connection takes two files):
#   worker_rlimit_nofile 65536;
#   events { worker_connections 4096; }

upstream minigeoportal {
    # One visitor stays with one replica, so the rate limits counted there apply to the visitor
    # as a whole. A replica that is down (an update in progress) is skipped for 5 seconds.
    hash $binary_remote_addr consistent;
    server 127.0.0.1:8787 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8788 max_fails=1 fail_timeout=5s;
    # Connections to the app are kept and reused instead of opened for every request.
    keepalive 64;
}

# The www address leads to the main one.
server {
    listen 80;
    listen [::]:80;
    server_name www.example.org;
    return 301 https://example.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org;

    # Requests to the app are small (bug reports up to 16 KB).
    client_max_body_size 64k;

    location / {
        proxy_pass http://minigeoportal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app (TRUSTED_PROXY=1) takes the last address of X-Forwarded-For: the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Answers up to half a megabyte stay in memory instead of a temporary file on disk.
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        # A replica that refuses or fails is not the visitor's problem: the other one answers.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
