report:
  title: Report a problem
  sent: Thank you. The report has reached the administrator of the service.
  off: The report form is not available at the moment. Try again later.
  intro: Describe what does not work in the service. Mistakes in the data itself are reported to the institution that keeps it.
  category: What it is about
  message: Description of the problem
  atLeast: At least {count} characters.
  length: '{length} of {count} characters.'
  email: E-mail for a reply (optional)
  attachView: Attach the address of the current map view, to make the problem easier to reproduce.
  privacy: The report goes by e-mail to the administrator of the service together with the name of your browser. Give an e-mail address only if you want a reply; it is used for nothing else.
  send: Send the report
  # The mail to the administrator, in the language of app.yaml report.locale.
  mail:
    subject: '[{app}] Report: {category}'
    category: Kind
    contact: Contact
    noContact: none given
    view: Map view
    noView: not attached
    browser: Browser
    noBrowser: unknown
