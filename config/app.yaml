# The application: name, author, languages, search and optional modules.
# Every text can be one string or one string per language, e.g.
#   name: { pl: Mapa gminy, en: Municipal map }
# Secrets (SMTP password and the like) never go here: they belong in environment variables.

id: minigeoportal # short id: prefix of browser storage, part of the server's User-Agent
name: MiniGeoportal
title:
  pl: 'MiniGeoportal: działki, plany i ortofotomapa'
  en: 'MiniGeoportal: parcels, plans and orthophoto map'
description:
  pl: 'MiniGeoportal: szybkie sprawdzanie działki, planu miejscowego, cen transakcyjnych i ortofotomapy na danych GUGiK.'
  en: 'MiniGeoportal: a quick look at a parcel, its local plan, transaction prices and the orthophoto map, on GUGiK data.'
domain: minigeoportal.pl
contact: office@envirosolutions.pl

author:
  name: EnviroSolutions
  url: https://envirosolutions.pl

tagline:
  pl: Dane z geoportal.gov.pl – prościej i szybciej
  en: Data from geoportal.gov.pl, simpler and faster

# Texts in Markdown: content/welcome means content/welcome.pl.md (and welcome.en.md for English).
# Links may lead to web and e-mail addresses or open the report form: [formularz](app:report).
content:
  welcome: content/welcome
  accessibility: content/accessibility

# Every language has its own address (/en/), Polish (root) the bare one. The bare address shows
# Polish to browsers that want it and sends the others to their language, or to the default one
# when the app does not have it.
locales:
  default: en
  available: [pl, en]
  root: pl

links:
  # Where to send people when a layer cannot be shown here, and what to call it in links
  # (without a name: the host of the address).
  fallbackMap: https://mapy.geoportal.gov.pl/imap/Imgp_2.html
  fallbackName: geoportal.gov.pl

report:
  # Language of the report mails to the administrator (default: locales.default).
  locale: pl
  # Kinds of problems people can choose in the bug report form.
  categories:
    - id: mapa
      label: { pl: 'Mapa lub warstwy', en: 'Map or layers' }
    - id: wyszukiwanie
      label: { pl: 'Wyszukiwanie', en: 'Search' }
    - id: dzialki
      label: { pl: 'Działki i informacje o miejscu', en: 'Parcels and place information' }
    - id: dostepnosc
      label: { pl: 'Dostępność', en: 'Accessibility' }
    - id: inne
      label: { pl: 'Inne', en: 'Other' }

search:
  # gugik: addresses, places, units and parcels from GUGiK services; nominatim: OpenStreetMap; none
  provider: gugik
  # The parcel search by voivodeship, county, municipality and precinct (needs the gugik module).
  parcel: true

modules:
  # Integration with geoportal.gov.pl: its whole layer catalog, its drawing order,
  # the orthophoto index and the parcel report. Other deployments leave it out.
  gugik:
    enabled: true
    catalog: true
    drawOrder: true
    ortho: true
    parcelReport: true
