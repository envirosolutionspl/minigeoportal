# The application: name, author, languages, search and optional modules.
# Every text can be one string or one string per language, e.g.
#   name: { pl: Mapa gminy, en: Municipal map }
# Secrets (SMTP password and the like) never go here: they belong in environment variables.

id: minigeoportal # short id: prefix of browser storage, part of the server's User-Agent
name: MiniGeoportal
title:
  pl: MiniGeoportal – szybsza mapa działek z Geoportalu Krajowego
  en: MiniGeoportal – a faster parcel map from the Polish Geoportal
description:
  pl: 'Lżejsza i szybsza przeglądarka danych Geoportalu Krajowego (GUGiK): działki po numerze, plany miejscowe (MPZP), ceny transakcyjne, ortofotomapa i mapy archiwalne.'
  en: 'A lighter, faster viewer of the Polish Geoportal data (GUGiK): parcels by number, local plans (MPZP), transaction prices, the orthophoto map and archival maps.'
domain: minigeoportal.pl
contact: office@envirosolutions.pl
# Bug reports and critical errors of the server go here by e-mail (the mail server: environment
# variables SMTP_*); without it both are off.
admin: office@envirosolutions.pl

author:
  name: EnviroSolutions
  url: https://envirosolutions.pl
  logo: brand/envirosolutions.svg # shown instead of the name; without it, the name

tagline:
  pl: Dane z geoportal.gov.pl – prościej i szybciej
  en: Data from geoportal.gov.pl, simpler and faster

# Texts in Markdown: content/welcome means content/welcome.pl.md (and welcome.en.md for English).
# Links may lead to web and e-mail addresses or open the report form: [formularz](app:report).
content:
  welcome: content/welcome
  accessibility: content/accessibility

# Help pages for people who come from a web search: content/guides/<page>.<language>.md, each at
# its own address (/pomoc/<page>), in the languages that have the file; /pomoc lists them and
# /sitemap.xml points search engines to them.
guides:
  path: { pl: pomoc, en: help }
  pages:
    - czy-dzialka-jest-budowlana
    - teren-zalewowy
    - granice-i-wymiary-dzialki
    - numer-ksiegi-wieczystej

# Every language has its own address (/en/), Polish (root) the bare one. The bare address shows
# Polish to browsers that want it and sends the others to their language, or to the default one
# when the app does not have it.
locales:
  default: en
  available: [pl, en]
  root: pl

links:
  # Where to send people when a layer cannot be shown here, and what to call it in links
  # (without a name: the host of the address).
  fallbackMap: https://mapy.geoportal.gov.pl/imapnext/imap/index.html?moduleId=modulGK
  fallbackName: geoportal.gov.pl

report:
  # Language of the report mails to the administrator (default: locales.default).
  locale: pl
  # Kinds of problems people can choose in the bug report form.
  categories:
    - id: mapa
      label: { pl: 'Mapa lub warstwy', en: 'Map or layers' }
    - id: wyszukiwanie
      label: { pl: 'Wyszukiwanie', en: 'Search' }
    - id: dzialki
      label: { pl: 'Działki i informacje o miejscu', en: 'Parcels and place information' }
    - id: dostepnosc
      label: { pl: 'Dostępność', en: 'Accessibility' }
    - id: inne
      label: { pl: 'Inne', en: 'Other' }

search:
  # gugik: addresses, places, units and parcels from GUGiK services; nominatim: OpenStreetMap; none
  provider: gugik
  # The parcel search by voivodeship, county, municipality and precinct (needs the gugik module).
  parcel: true

modules:
  # Integration with geoportal.gov.pl: its whole layer catalog, its drawing order,
  # the orthophoto index and the parcel report. Other deployments leave it out.
  gugik:
    enabled: true
    catalog: true
    drawOrder: true
    # The tile service of map.yaml that shows the aerial photos, and the layer of layers.yaml that
    # shows their archive (the time view offers the dates the photo index knows at a point).
    ortho: { service: orto, history: orto-archiwalna }
    # The layer of layers.yaml with the old topographic maps: the time view offers the years of the
    # sheets the index of topographic maps knows at a point, each drawing its own sheet.
    topo: { history: mapy-dawne }
    parcelReport: true
    # Heights of the terrain (the elevation model): in the place panel and the "Terrain profile" tool.
    elevation: true
    # The address nearest to the clicked point (within 100 m), in the place panel.
    address: true
