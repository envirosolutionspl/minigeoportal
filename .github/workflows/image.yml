# Checks the code and publishes the container image as ghcr.io/<owner>/<repository>.
# Runs only when something that goes into the image changes (the texts in config/content too):
# documentation, examples and the compose and proxy files alone build nothing (docs.yml checks them).
# Pushes to main publish the tags latest and sha-<commit>; tags v1.2.3 publish 1.2.3 and 1.2;
# pull requests are checked and built, never published.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      [
        'README.md',
        'SECURITY.md',
        'CONTRIBUTING.md',
        'docs/**',
        'examples/**',
        'LICENSE',
        '.env.example',
        'compose*.yaml',
        'deploy/**',
        '.github/workflows/docs.yml',
        '.github/workflows/release.yml',
        '.github/releases/**',
      ]
  pull_request:
    paths-ignore:
      [
        'README.md',
        'SECURITY.md',
        'CONTRIBUTING.md',
        'docs/**',
        'examples/**',
        'LICENSE',
        '.env.example',
        'compose*.yaml',
        'deploy/**',
        '.github/workflows/docs.yml',
        '.github/workflows/release.yml',
        '.github/releases/**',
      ]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known high or critical holes in what the server runs fail the check; build tools stay out.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # x86 only: Node in an emulated ARM build crashes (exit 132); ARM would need a native runner.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
