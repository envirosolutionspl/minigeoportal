# Texts of the gugik module in English, added to the app's own (i18n/en.yaml) when app.yaml enables
# the module. A deployment changes them in i18n/en.yaml of its configuration directory, as any other.

search:
  parcel: 'Parcel: find by number and precinct'
  parcelShort: Parcel
  parcelHit: Parcel {number}
  gugik:
    placeholder: Address, town, parcel…
    label: Search for an address, town or parcel
    # Services that did not answer in time, named under the results.
    unavailable:
      parcels: the parcel search (ULDK)
      addresses: the address search (UUG)
      names: the search of place and object names (PRNG)
      units: the search of administrative units (PRG)

parcel:
  title: Find a parcel
  panel: Parcel search
  found: Parcel found
  change: Change
  clearAndClose: Clear and close
  voivodeship: Voivodeship
  county: County
  commune: Municipality
  precinct: Precinct
  number: Parcel number
  numberPlaceholder: e.g. 22/1
  search: Find the parcel
  notFound: Parcel {number} was not found in precinct {precinct}. Check the number, including how it is written with a slash.
  error: The GUGiK parcel service does not answer. Try again in a moment.
  several:
    one: '{count} parcel with this number found. Choose it.'
    other: '{count} parcels with this number found. Choose one.'
  choose: Choose
  listFailed: List not loaded
  retry: Try again
  retryList: 'Try again: {label}'

layers:
  catalogLoading: Loading the list of geoportal.gov.pl layers…
  catalogPreparing: The list of all geoportal.gov.pl layers is being prepared. Try again in a few minutes.
  catalogError: The list of geoportal.gov.pl layers could not be loaded. The layers above work.

info:
  parcelReport: Parcel report
  parcelReportHint: (geoportal.gov.pl, opens in a new tab)
  photoFrom: Orthophoto map from a photo of
  pixel: pixel
  downloadSheet: download sheet {sheet}
  photoLoading: Checking the date of the aerial photo…
  photoAsOf: 'As of {date}: photo of'
  photos:
    one: '{count} photo since {year}'
    other: '{count} photos since {year}'
  seeChanges: See the changes
  height: 'Height of the terrain: {height} above sea level'

topo:
  sheet: 'sheet 1:{scale} in the {system} system'

tools:
  parcels: Parcel selection

parcels:
  title: Parcel selection
  hint: Click a parcel on the map to add it to the selection, click a selected one to remove it. With the keyboard, Enter does so in the middle of the map. Parcels can also be added from the search. At most {max} parcels; the view's link carries the selection.
  end: Close the parcel selection
  empty: The selection is empty. Click a parcel on the map or find it with the search.
  total: 'Parcels: {count} of {max} · {area} in all'
  areaSource: Area from the parcel's geometry in ULDK (on the GRS80 ellipsoid), not the land register's area.
  row: 'parcel {number}, precinct {region} · {area}'
  loading: Loading from ULDK…
  looking: Looking for the parcel here…
  missing: Not in ULDK (divided, for instance).
  error: ULDK did not answer. Try again in a moment.
  none: There is no parcel here.
  added: 'Parcel {id} added.'
  removed: 'Parcel {id} removed.'
  already: 'Parcel {id} is already in the selection.'
  full: 'The selection has {max} parcels already: remove one to add another.'
  remove: 'Remove parcel {id} from the selection'
  showAll: Show all
  export: Download the selection
  exportAs: 'Download the selection as {format}'
  clear: Clear
  add: Add to the selection
  open: Show the selection
