        title: Powiaty z danymi
        default: true
      - name: przewod_wodociagowy
        title: Woda
        default: true
      - name: przewod_kanalizacyjny
        title: Kanalizacja
        default: true
      - name: przewod_gazowy
        title: Gaz
        default: true
      - name: przewod_elektroenergetyczny
        title: Elektroenergetyka
        default: true
      - name: przewod_telekomunikacyjny
        title: Telekomunikacja
        default: true
      - name: przewod_cieplowniczy
        title: Ciepłownictwo
        default: true
      - name: przewod_specjalny
        title: Sieć specjalna
        default: true
      - name: przewod_niezidentyfikowany
        title: Sieci niezidentyfikowane
        default: true
      - name: przewod_urzadzenia
        title: Urządzenia
        default: true
  - id: kibdot
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaBazDanychObiektowTopograficznych
    title: Obiekty topograficzne (BDOT500)
    description: 'Szczegółowa mapa zasadnicza: budowle, ogrodzenia, chodniki, drogi, skarpy.'
    topic: dzialki
    starter: true
    catalogId: msKIBDOT
    keywords:
