report:
  intro: Opisz, co nie działa w serwisie. Błędy w samych danych (np. granice działek) zgłasza się urzędowi, który je prowadzi.

print:
  note: 'Źródło warstw mapy: geoportal.gov.pl (Główny Urząd Geodezji i Kartografii) oraz udostępniane przez niego usługi starostw, gmin i innych instytucji. Mapa poglądowa, nie jest dokumentem urzędowym. Układ współrzędnych {system} ({code}).'
