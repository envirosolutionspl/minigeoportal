# nginx in front of MiniGeoportal running with compose.proxy.yaml (the app on 127.0.0.1:8787).
# Copy to /etc/nginx/sites-available/, replace example.org with your domain, link it into
# sites-enabled, then `nginx -t && systemctl reload nginx` and get a certificate:
#   certbot --nginx -d example.org -d www.example.org --redirect

# The www address leads to the main one.
server {
    listen 80;
    listen [::]:80;
    server_name www.example.org;
    return 301 https://example.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org;

    # Requests to the app are small (bug reports up to 16 KB).
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app (TRUSTED_PROXY=1) takes the last address of X-Forwarded-For: the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
