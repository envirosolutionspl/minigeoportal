# Checks changes that build no image (documentation, examples, compose and proxy files): the
# same checks as image.yml, so a field missing from the docs or a broken example still fails.
name: Docs

on:
  push:
    branches: [main]
    paths: ['README.md', 'SECURITY.md', 'CONTRIBUTING.md', 'docs/**', 'examples/**', '.env.example', 'compose*.yaml', 'deploy/**']
  pull_request:
    paths: ['README.md', 'SECURITY.md', 'CONTRIBUTING.md', 'docs/**', 'examples/**', '.env.example', 'compose*.yaml', 'deploy/**']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known high or critical holes in what the server runs fail the check; build tools stay out.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run config:check examples/osm
