# Layers drawn over the base map: topics of the layer list, the layers, their drawing order.
# A layer's sublayers are listed in the order the layer list shows them; `default: true` ones are
# switched on with the layer. `catalogId` names the same layer in the geoportal.gov.pl catalog.
# Time-capable layers get a `time` block (see docs): a TIME dimension or a series of editions.

topics:
  - id: dzialki
    title: { pl: 'Działki i budynki', en: 'Parcels and buildings' }
  - id: planowanie
    title: { pl: 'Planowanie', en: 'Planning' }
  - id: ceny
    title: { pl: 'Ceny', en: 'Prices' }
  - id: uzbrojenie
    title: { pl: 'Uzbrojenie i drogi', en: 'Utilities and roads' }
  - id: granice
    title: { pl: 'Granice i adresy', en: 'Boundaries and addresses' }
  - id: teren
    title: { pl: 'Teren i zdjęcia', en: 'Terrain and photos' }
  - id: srodowisko
    title: { pl: 'Środowisko', en: 'Environment' }
  - id: zagrozenia
    title: { pl: 'Zagrożenia', en: 'Hazards' }
  - id: zabytki
    title: { pl: 'Zabytki i turystyka', en: 'Heritage and tourism' }
  - id: archiwalne
    title: { pl: 'Archiwalne', en: 'Archival' }
  - id: pobieranie
    title: { pl: 'Dane do pobrania', en: 'Data downloads' }
  - id: geodezja
    title: { pl: 'Geodezja', en: 'Surveying' }
  - id: inne
    title: { pl: 'Inne', en: 'Other' }
# Drawing order, lowest first: plans at the bottom, networks over them, parcels over both.
drawOrder:
  - mapy-dawne
  - orto-archiwalna
  - suikzp
  - kimpzp
  - pog
  - kibdot
  - kiut
  - kieg
  - rcn
  - kina
  - prg
overlays:
  - id: kieg
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow
    title: { pl: 'Ewidencja gruntów i budynków', en: 'Land and building register' }
    description: { pl: 'Działki, numery działek, budynki, obręby, użytki.', en: 'Parcels, parcel numbers, buildings, precincts, land use.' }
    topic: dzialki
    starter: true
    catalogId: msKIEG
    keywords:
      pl: [działki, ewidencja, egib, granice, numery, budynki, obręby, użytki, kontury, klasy]
      en: [parcels, land register, cadastre, boundaries, numbers, buildings, precincts, land use]
    sublayers:
      - name: uzytki
        title: { pl: 'Użytki gruntowe', en: 'Land use' }
      - name: kontury
        title: { pl: 'Kontury klasyfikacyjne', en: 'Soil class contours' }
      - name: obreby
        title: { pl: 'Granice obrębów', en: 'Precinct boundaries' }
        default: true
      - name: dzialki
        title: { pl: 'Działki', en: 'Parcels' }
        default: true
      - name: geoportal
        title: { pl: 'Działki uzupełnione z LPIS', en: 'Parcels completed from LPIS' }
      - name: budynki
        title: { pl: 'Budynki', en: 'Buildings' }
        default: true
      - name: numery_dzialek
        title: { pl: 'Numery działek', en: 'Parcel numbers' }
        default: true
  - id: kimpzp
    kind: wms
    # `granice` and `plany` are left out: they redirect to municipal servers that reject browser requests.
    url: https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaMiejscowychPlanowZagospodarowaniaPrzestrzennego
    title: { pl: 'Plany miejscowe (MPZP)', en: 'Local plans (MPZP)' }
    description: { pl: 'Miejscowe plany zagospodarowania przestrzennego.', en: 'Local spatial development plans.' }
    topic: planowanie
    starter: true
    catalogId: msMPZP
    opacity: 0.8
    keywords:
      pl: [mpzp, plan, zagospodarowanie, przeznaczenie, budowa, zabudowa]
      en: [local plan, zoning, land use, development, building lines]
    sublayers:
      - name: raster
        title: { pl: 'Plany rastrowe (skany rysunków)', en: 'Raster plans (scanned drawings)' }
        default: true
      - name: wektor-str
        title: { pl: 'Strefy przeznaczenia', en: 'Land use zones' }
        default: true
      - name: wektor-pow
        title: { pl: 'Obiekty powierzchniowe', en: 'Area features' }
        default: true
      - name: wektor-lin
        title: { pl: 'Obiekty liniowe', en: 'Line features' }
        default: true
      - name: wektor-lzb
        title: { pl: 'Linie zabudowy', en: 'Building lines' }
        default: true
      - name: wektor-pkt
        title: { pl: 'Obiekty punktowe', en: 'Point features' }
        default: true
  - id: pog
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/ext/PlanyOgolneGmin
    title: { pl: 'Plany ogólne gmin (POG)', en: 'General municipal plans (POG)' }
    description: { pl: 'Strefy planistyczne z uchwalonych planów ogólnych.', en: 'Planning zones of adopted general plans.' }
    topic: planowanie
    starter: true
    catalogId: msPlanyOgolneGmin
    opacity: 0.8
    keywords:
      pl: [pog, plan ogólny, strefy, planistyczne]
      en: [general plan, zoning, planning zones]
    sublayers:
      - name: aktPlanowaniaprzestrzennego
        title: { pl: 'Zasięg planu ogólnego', en: 'Extent of the general plan' }
        default: true
      - name: strefaPlanistyczna
        title: { pl: 'Strefy planistyczne', en: 'Planning zones' }
        default: true
      - name: obszarUzupelnieniaZabudowy
        title: { pl: 'Obszary uzupełnienia zabudowy', en: 'Infill development areas' }
        default: true
      - name: obszarZabSrodmiejskiej
        title: { pl: 'Obszary zabudowy śródmiejskiej', en: 'Inner-city development areas' }
        default: true
  - id: rcn
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/service/rcn
    title: { pl: 'Ceny transakcyjne (RCN)', en: 'Transaction prices (RCN)' }
    description:
      { pl: 'Rejestr cen nieruchomości, tylko powiaty publikujące dane.', en: 'Real estate price register, only counties that publish it.' }
    topic: ceny
    starter: true
    catalogId: msRejestrCenNieruchomosci
    keywords:
      pl: [ceny, rcn, transakcje, wartość, sprzedaż, mieszkania, lokale]
      en: [prices, transactions, real estate, market]
    sublayers:
      - name: powiaty
        title: { pl: 'Powiaty z danymi', en: 'Counties with data' }
        default: true
      - name: dzialki
        title: { pl: 'Transakcje: działki', en: 'Transactions: parcels' }
        default: true
      - name: budynki
        title: { pl: 'Transakcje: budynki', en: 'Transactions: buildings' }
        default: true
      - name: lokale
        title: { pl: 'Transakcje: lokale', en: 'Transactions: flats' }
        default: true
  - id: kiut
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaUzbrojeniaTerenu
    title: { pl: 'Uzbrojenie terenu', en: 'Utility networks' }
    description:
      {
        pl: 'Sieci: woda, kanalizacja, gaz, prąd, telekomunikacja, ciepło.',
        en: 'Networks: water, sewers, gas, power, telecommunications, heating.',
      }
    topic: uzbrojenie
    starter: true
    catalogId: msKIUT
    keywords:
      pl: [uzbrojenie, gesut, sieci, przyłącze, media]
      en: [utilities, water, sewers, gas, power, electricity, telecommunications, heating, pipes, cables]
    sublayers:
      - name: gesut
        title: { pl: 'Powiaty z danymi', en: 'Counties with data' }
        default: true
      - name: przewod_wodociagowy
        title: { pl: 'Woda', en: 'Water' }
        default: true
      - name: przewod_kanalizacyjny
        title: { pl: 'Kanalizacja', en: 'Sewers' }
        default: true
      - name: przewod_gazowy
        title: { pl: 'Gaz', en: 'Gas' }
        default: true
      - name: przewod_elektroenergetyczny
        title: { pl: 'Elektroenergetyka', en: 'Power' }
        default: true
      - name: przewod_telekomunikacyjny
        title: { pl: 'Telekomunikacja', en: 'Telecommunications' }
        default: true
      - name: przewod_cieplowniczy
        title: { pl: 'Ciepłownictwo', en: 'Heating' }
        default: true
      - name: przewod_specjalny
        title: { pl: 'Sieć specjalna', en: 'Special network' }
        default: true
      - name: przewod_niezidentyfikowany
        title: { pl: 'Sieci niezidentyfikowane', en: 'Unidentified networks' }
        default: true
      - name: przewod_urzadzenia
        title: { pl: 'Urządzenia', en: 'Devices' }
        default: true
  - id: kibdot
    kind: wms
    url: https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaBazDanychObiektowTopograficznych
    title: { pl: 'Obiekty topograficzne (BDOT500)', en: 'Topographic objects (BDOT500)' }
    description:
      {
        pl: 'Szczegółowa mapa zasadnicza: budowle, ogrodzenia, chodniki, drogi, skarpy.',
        en: 'Detailed base map: structures, fences, pavements, roads, embankments.',
      }
    topic: dzialki
    starter: true
    catalogId: msKIBDOT
    keywords:
      pl: [bdot500, mapa zasadnicza, topografia, ogrodzenia, budowle, chodniki, drogi, skarpy, kibdot]
      en: [topographic, base map, fences, pavements, roads, structures]
    sublayers:
      - name: wdrozenia
        title: { pl: 'Powiaty z danymi', en: 'Counties with data' }
        default: true
      - name: bdot
        title: { pl: 'Obiekty topograficzne', en: 'Topographic objects' }
        default: true
  - id: suikzp
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaStudiumKierunkowZagospodarowaniaPrzestrzennego
    title: { pl: 'Studium zagospodarowania', en: 'Municipal land use study' }
    description:
      {
        pl: 'Studium uwarunkowań i kierunków zagospodarowania gminy, gdzie nie ma planu.',
        en: 'Study of conditions and directions of municipal development, where there is no plan.',
      }
    topic: planowanie
    starter: true
    catalogId: msSUiKZP
    opacity: 0.8
    keywords:
      pl: [studium, suikzp, kierunki, zagospodarowanie, gmina, przeznaczenie]
      en: [study, land use, development directions]
    sublayers:
      - name: gminy
        title: { pl: 'Gminy z danymi', en: 'Municipalities with data' }
        default: true
      - name: studium
        title: { pl: 'Studium', en: 'Study' }
        default: true
  - id: kina
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaNumeracjiAdresowej
    title: { pl: 'Adresy i ulice', en: 'Addresses and streets' }
    description:
      {
        pl: 'Punkty adresowe z numerami i osie ulic z gminnych ewidencji.',
        en: 'Address points with numbers and street axes from municipal registers.',
      }
    topic: granice
    starter: true
    catalogId: msAdresyUlice
    keywords:
      pl: [adresy, numery, ulice, emuia, punkty adresowe, kina]
      en: [addresses, streets, house numbers]
    sublayers:
      - name: A08_Ulice_Powierzchnie
        title: { pl: 'Ulice: obszary', en: 'Streets: areas' }
      - name: A08_Ulice_Linie
        title: { pl: 'Ulice: osie', en: 'Streets: axes' }
        default: true
      - name: A07_Punkty_adresowe
        title: { pl: 'Punkty adresowe', en: 'Address points' }
        default: true
  - id: prg
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/service/PZGIK/PRG/WMS/AdministrativeBoundaries
    title: { pl: 'Granice administracyjne (PRG)', en: 'Administrative boundaries (PRG)' }
    description:
      {
        pl: 'Granice województw, powiatów, gmin i obrębów, a także sądów, urzędów i nadleśnictw.',
        en: 'Boundaries of voivodeships, counties, municipalities and precincts, and of courts, tax offices and forest districts.',
      }
    topic: granice
    starter: true
    catalogId: msPRG
    keywords:
      pl: [granice, prg, gmina, powiat, województwo, obręb, jednostka, sąd, urząd skarbowy, nadleśnictwo, spis]
      en: [boundaries, administrative, voivodeships, counties, municipalities, border]
    sublayers:
      - name: R01_Granice_rejonow_statystycznych
        title: { pl: 'Rejony statystyczne', en: 'Statistical regions' }
      - name: U06_Nadlesnictwo
        title: { pl: 'Nadleśnictwa', en: 'Forest districts' }
      - name: U02_Urzad_skarbowy
        title: { pl: 'Urzędy skarbowe', en: 'Tax offices' }
      - name: S03_Sad_rejonowy
        title: { pl: 'Sądy rejonowe', en: 'District courts' }
      - name: A06_Granice_obrebow_ewidencyjnych
        title: { pl: 'Obręby ewidencyjne', en: 'Cadastral precincts' }
      - name: A05_Granice_jednostek_ewidencyjnych
        title: { pl: 'Jednostki ewidencyjne', en: 'Cadastral units' }
      - name: A04_Granice_miast
        title: { pl: 'Miasta', en: 'Towns' }
      - name: A03_Granice_gmin
        title: { pl: 'Gminy', en: 'Municipalities' }
        default: true
      - name: A02_Granice_powiatow
        title: { pl: 'Powiaty', en: 'Counties' }
        default: true
      - name: A01_Granice_wojewodztw
        title: { pl: 'Województwa', en: 'Voivodeships' }
        default: true
      - name: A00_Granice_panstwa
        title: { pl: 'Granica państwa', en: 'State border' }
        default: true
  - id: orto-archiwalna
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolutionTime
    title: { pl: 'Ortofotomapa archiwalna', en: 'Archival orthophoto map' }
    description:
      {
        pl: 'Zdjęcia lotnicze z lat 1995–2025: stan na wybraną datę. Podróż w czasie pokazuje tylko daty, z których są tu zdjęcia.',
        en: 'Aerial photos of 1995–2025 as of a chosen date. The time view offers only the dates with photos of the place.',
      }
    topic: archiwalne
    catalogId: msORTO_TIME_WMS
    format: image/jpeg # opaque photos: a third of the bytes of PNG
    keywords:
      pl: [archiwalna, dawne, historyczne, zdjęcia, lata, czas, kiedyś, zmiany]
      en: [archival, old, historical, photos, years, time, changes]
    sublayers:
      - name: Raster
        title: { pl: 'Ortofotomapa archiwalna', en: 'Archival orthophoto map' }
        default: true
    # The service draws the newest photo taken on or before TIME; the dates it lists are months.
    time: { type: dimension, param: TIME, values: capabilities }
  - id: mapy-dawne
    kind: wms
    url: https://mapy.geoportal.gov.pl/wss/service/img/guest/TOPO_SERIA/MapServer/WMSServer
    title: { pl: 'Mapy topograficzne dawne', en: 'Old topographic maps' }
    description:
      {
        pl: 'Skany map topograficznych 1:10 000, 1:25 000 i 1:50 000 w układach 1942, 1965 i 1992, od lat 50. do 2000.',
        en: 'Scans of topographic maps 1:10 000, 1:25 000 and 1:50 000 in the 1942, 1965 and 1992 systems, from the 1950s to the 2000s.',
      }
    topic: archiwalne
    catalogId: msTOPO_SERIA_10_1992
    format: image/jpeg # scanned sheets are opaque
    keywords:
      pl: [mapy, topograficzne, dawne, archiwalne, historyczne, układ 1965, układ 1942, skany]
      en: [maps, topographic, old, archival, historical, scans]
    sublayers:
      - name: Raster_50_1942
        title: { pl: 'Układ 1942, 1:50 000', en: '1942 system, 1:50 000' }
      - name: Raster_10_1942
        title: { pl: 'Układ 1942, 1:10 000', en: '1942 system, 1:10 000' }
      - name: Raster_50_1965
        title: { pl: 'Układ 1965, 1:50 000', en: '1965 system, 1:50 000' }
      - name: Raster_25_1965
        title: { pl: 'Układ 1965, 1:25 000', en: '1965 system, 1:25 000' }
      - name: Raster_10_1965
        title: { pl: 'Układ 1965, 1:10 000', en: '1965 system, 1:10 000' }
      - name: Raster_50_1992
        title: { pl: 'Układ 1992, 1:50 000', en: '1992 system, 1:50 000' }
        default: true
      - name: Raster_10_1992
        title: { pl: 'Układ 1992, 1:10 000', en: '1992 system, 1:10 000' }
        default: true
    # One edition per system of maps: its sheets at every scale, the service drawing each in its
    # own scale range (the finer ones listed last, so they lie on top).
    time:
      type: series
      editions:
        - value: '1942'
          layer: Raster_50_1942,Raster_10_1942
          label: { pl: 'Mapy w układzie 1942, lata 50.–70.', en: 'Maps in the 1942 system, 1950s to 1970s' }
        - value: '1965'
          layer: Raster_50_1965,Raster_25_1965,Raster_10_1965
          label: { pl: 'Mapy w układzie 1965, lata 70.–90.', en: 'Maps in the 1965 system, 1970s to 1990s' }
        - value: '1992'
          layer: Raster_50_1992,Raster_10_1992
          label: { pl: 'Mapy w układzie 1992, lata 90. i 2000.', en: 'Maps in the 1992 system, 1990s and 2000s' }
