# Checks the code and publishes the container image as ghcr.io/<owner>/<repository>.
# Runs only when something that goes into the image changes (the texts in config/content too):
# documentation, examples and the compose and proxy files alone build nothing (docs.yml checks them).
# Pushes to main publish the tags latest and sha-<commit>; tags v1.2.3 publish 1.2.3 and 1.2;
# pull requests are checked and built, never published.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      [
        'README.md',
        'SECURITY.md',
        'CONTRIBUTING.md',
        'docs/**',
        'examples/**',
        'LICENSE',
        '.env.example',
        'compose*.yaml',
        'deploy/**',
        '.github/workflows/docs.yml',
        '.github/workflows/release.yml',
        '.github/releases/**',
      ]
  pull_request:
    paths-ignore:
      [
        'README.md',
        'SECURITY.md',
        'CONTRIBUTING.md',
        'docs/**',
        'examples/**',
        'LICENSE',
        '.env.example',
        'compose*.yaml',
        'deploy/**',
        '.github/workflows/docs.yml',
        '.github/workflows/release.yml',
        '.github/releases/**',
      ]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known high or critical holes in what the server runs fail the check; build tools stay out.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # x86 only: Node in an emulated ARM build crashes (exit 132); ARM would need a native runner.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
